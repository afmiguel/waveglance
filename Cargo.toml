[package]
name = "fnirsi-viewer"
version = "0.8.0"
edition = "2024"
description = "Viewer for the binary .wav waveform files of the FNIRSI DPOX180H oscilloscope"

[lib]
# cdylib: the WebAssembly build (Trunk) starts from lib.rs.
crate-type = ["cdylib", "rlib"]

[dependencies]
binrw = "=0.15.2"
# persistence: the measurement settings are saved between sessions.
eframe = { version = "=0.37.0", features = ["persistence"] }
egui_plot = "=0.38.0"
log = "=0.4.35"
# PNG screenshots.
png = "=0.18.1"
rfd = "=0.17.2"
serde = { version = "=1.0.229", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "=0.11.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "=0.4.80"
js-sys = "=0.3.107"
web-sys = { version = "=0.3.107", features = ["Window", "Document", "HtmlCanvasElement", "Element", "HtmlAnchorElement", "Blob", "BlobPropertyBag", "Url", "HtmlImageElement", "HtmlElement", "DomTokenList"] }

[profile.release]
opt-level = 2

# Faster debug builds of the plot code.
[profile.dev.package."*"]
opt-level = 2
