[package]
name = "waveglance"
version = "0.32.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/afmiguel/waveglance"
homepage = "https://afmiguel.github.io/waveglance/"
readme = "README.md"
keywords = ["oscilloscope", "logic-analyzer", "waveform", "vcd", "decoder"]
categories = ["science", "visualization", "embedded"]
description = "Viewer for oscilloscope and logic analyzer files (FNIRSI, Keysight, Rigol, VCD, CSV), with measurements, FFT and UART/I2C/SPI decoders"

[lib]
# cdylib: the WebAssembly build (Trunk) starts from lib.rs.
crate-type = ["cdylib", "rlib"]

# The desktop program. Not named like the library: the WebAssembly build
# would make two waveglance.wasm files.
[[bin]]
name = "waveglance-desktop"
path = "src/main.rs"

[dependencies]
binrw = "=0.15.2"
# persistence: the measurement settings are saved between sessions.
eframe = { version = "=0.37.0", features = ["persistence"] }
egui_plot = "=0.38.0"
log = "=0.4.35"
# PNG screenshots.
png = "=0.18.1"
rfd = "=0.17.2"
serde = { version = "=1.0.229", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "=0.11.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "=0.4.80"
js-sys = "=0.3.107"
web-sys = { version = "=0.3.107", features = ["Window", "Document", "HtmlCanvasElement", "Element", "HtmlAnchorElement", "Blob", "BlobPropertyBag", "Url", "HtmlImageElement", "HtmlElement", "DomTokenList", "Location", "Node"] }

# Windows: the icon and version information of the .exe (build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = { version = "=0.1.34", default-features = false }

[profile.release]
opt-level = 2

# Faster debug builds of the plot code.
[profile.dev.package."*"]
opt-level = 2
