# Build the desktop programs for macOS, Windows and Linux when a version tag
# (vX.Y.Z) is pushed, and publish them in a GitHub Release with the notes of
# that version from CHANGELOG.md.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# The build jobs only read the code; only the release job can write (create
# the release and upload the files).
permissions:
  contents: read

env:
  RUST_VERSION: "1.97.1"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-apple-silicon
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-intel
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target ${{ matrix.target }}
          rustup default "$RUST_VERSION"

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libgtk-3-dev

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }} --bin waveglance-desktop

      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          dir="waveglance-${GITHUB_REF_NAME}-${{ matrix.name }}"
          bin="target/${{ matrix.target }}/release/waveglance-desktop"
          docs="README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE"
          mkdir "$dir"
          case "${{ runner.os }}" in
            macOS)
              # An application bundle: WaveGlance.app, with the icon and
              # Info.plist. Ad-hoc signed (no Apple ID), so macOS sees one
              # whole, unchanged bundle.
              app="$dir/WaveGlance.app"
              mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
              cp "$bin" "$app/Contents/MacOS/WaveGlance"
              # Assets.car: the icon of macOS 26 and later (Icon Composer);
              # AppIcon.icns: macOS 11 to 15. Both made by make-icons.py.
              cp assets/icon/macos/Assets.car assets/icon/macos/AppIcon.icns "$app/Contents/Resources/"
              sed "s/@VERSION@/$version/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
              plutil -lint "$app/Contents/Info.plist"
              codesign --force --sign - "$app"
              codesign --verify --verbose "$app"
              cp $docs "$dir/"
              # ditto keeps the bundle as macOS expects it.
              ditto -c -k --keepParent "$dir" "$dir.zip"
              echo "ASSET=$dir.zip" >> "$GITHUB_ENV"
              ;;
            Windows)
              # The icon is in the .exe (build.rs).
              cp "$bin.exe" "$dir/WaveGlance.exe"
              cp $docs "$dir/"
              7z a "$dir.zip" "$dir" > /dev/null
              echo "ASSET=$dir.zip" >> "$GITHUB_ENV"
              ;;
            Linux)
              # The program, its menu entry, the icons and an installer for
              # the user's own folders. tar keeps the file permissions.
              cp "$bin" "$dir/waveglance"
              cp packaging/linux/waveglance.desktop packaging/linux/install.sh "$dir/"
              mkdir "$dir/icons"
              cp -R assets/icon/linux/hicolor "$dir/icons/"
              cp $docs "$dir/"
              tar -czf "$dir.tar.gz" "$dir"
              echo "ASSET=$dir.tar.gz" >> "$GITHUB_ENV"
              ;;
          esac

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: assets
          merge-multiple: true

      - name: Checksums
        run: |
          cd assets
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The section of this version: from its "## X.Y.Z" line to the next "## ".
          awk -v v="$version" '
            $0 ~ "^## " v " " { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<'EOF'

          ---
          **Use it in the browser, with no installation:** https://afmiguel.github.io/waveglance/

          **Desktop programs** (below). They are not signed with a paid
          certificate, so the system asks once:
          - **macOS:** unzip and move `WaveGlance.app` to Applications. The
            first time, right-click it and choose Open (on macOS 15 and later:
            System Settings → Privacy & Security → Open Anyway), or run
            `xattr -dr com.apple.quarantine WaveGlance.app`.
          - **Windows:** unzip and run `WaveGlance.exe`; if SmartScreen asks,
            choose "More info" → "Run anyway".
          - **Linux:** `tar xzf` the file, then run `./waveglance`, or
            `./install.sh` to add it to the applications menu.

          A file name on the command line opens that file:
          `waveglance capture.wav`.
          EOF
          cat notes.md

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: WaveGlance ${{ github.ref_name }}
          body_path: notes.md
          files: |
            assets/*.zip
            assets/*.tar.gz
            assets/SHA256SUMS.txt
