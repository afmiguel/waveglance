# Checks on every push and pull request: formatting, Clippy (desktop and
# WebAssembly, warnings are errors), all the tests (with the real sample
# files), and the dependency audit.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_VERSION: "1.97.1"
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal \
            --component clippy --component rustfmt --target wasm32-unknown-unknown
          rustup default "$RUST_VERSION"

      - name: Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libgtk-3-dev

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy (desktop)
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Clippy (WebAssembly)
        run: cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings

      - name: Sample files for the integration tests
        run: ./scripts/fetch-samples.sh

      - name: Tests
        run: cargo test --locked

      - name: Robustness tests in release mode
        run: cargo test --locked --release --test robustness

  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: cargo audit
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit
